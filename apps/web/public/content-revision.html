<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语文阅读内容升级</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#20332a;font:16px/1.7 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:40px 24px}h1{font-size:36px;margin:8px 0}.tag{color:#467a52;font-weight:700}header p{max-width:820px;color:#53635a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}article{background:white;border:1px solid #d9e1d9;border-radius:16px;overflow:hidden}article a{color:inherit;text-decoration:none;display:block}article a:hover{background:#f0f7ed}img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}.body{padding:20px}.body span{font-size:14px;color:#607467}h2{font-size:23px;margin:5px 0}b{color:#297242}.note{padding:16px 20px;background:#e7eee4;border-radius:12px}progress{display:block;width:100%;height:14px;accent-color:#467a52;margin:12px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}button{font:inherit;border:1px solid #9bad9e;background:white;color:#264932;border-radius:24px;padding:6px 18px;cursor:pointer}button[aria-pressed=true]{background:#315e40;color:white}footer{margin-top:30px;color:#667366;font-size:14px}#updated{font-size:13px;color:#607467}a:focus-visible,button:focus-visible{outline:3px solid #cf931e;outline-offset:3px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:28px}main{padding:24px 16px}}</style>
<main><header><div class="tag">语文阅读 · 内容升级</div><h1>和课文一起长大的阅读</h1><p>按真实课文校准篇幅，为每个年级设计词义、推断和表达练习。每篇通过内容审核，配齐插画与朗读后，才进入阅读书架。</p><div class="note"><strong id="summary" aria-live="polite">正在读取进度…</strong><progress id="progress" max="188" value="0"></progress><div id="details"></div><div id="updated"></div></div></header><nav class="filters" aria-label="按年级筛选"><button data-grade="0" aria-pressed="true">全部</button><button data-grade="1" aria-pressed="false">一年级</button><button data-grade="2" aria-pressed="false">二年级</button><button data-grade="3" aria-pressed="false">三年级</button><button data-grade="4" aria-pressed="false">四年级</button><button data-grade="5" aria-pressed="false">五年级</button><button data-grade="6" aria-pressed="false">六年级</button></nav><section class="grid" id="stories" aria-label="已上线的新故事"></section><footer>篇幅统计正文汉字，不含标点与题目。参照优先采用单元大纲点名的叙事课文，缺少映射时采用整册参照。模型审核配合编辑抽查，不代表人类教师逐篇签审。<br>故事：GPT-6 Luna · 图片：Muse Image · 语音：Gemini 3.8 Flash-Lite TTS</footer></main>
<script>
let current=null,grade=0,signature='';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function render(){if(!current)return;const key=grade+':'+JSON.stringify(current.stories);if(key===signature)return;signature=key;const grid=document.getElementById('stories');grid.replaceChildren();for(const s of current.stories.filter(s=>!grade||s.grade===grade).sort((a,b)=>a.grade-b.grade||a.bookId.localeCompare(b.bookId)||a.unit-b.unit)){const card=el('article'),link=el('a');link.href='/stories/'+s.bookId+'/'+s.id+'/';const img=el('img');img.src='/story-images/'+s.bookId+'/'+s.id+'.jpg';img.alt=s.title+'的插画';img.loading='lazy';const body=el('div',undefined,'body');body.append(el('span',s.grade+'年级'+s.term+' · 第'+s.unit+'单元 · '+s.questions+'道题'),el('h2',s.title),el('p','正文 '+s.chars+' 字 · 参照 '+s.baseline+' 字'),el('b','开始阅读 →'));link.append(img,body);card.append(link);grid.append(card);}}
async function refresh(){try{const r=await fetch('/content-revision-status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();current=await r.json();document.getElementById('summary').textContent='已上线 '+current.published+' / '+current.total+' 篇 · '+current.questions+' 道配套题';document.getElementById('progress').value=current.published;document.getElementById('details').textContent=current.published===current.total?'全部故事已完成替换，可以阅读、听读和答题。':'内容与媒体已就绪 '+current.ready+' 篇，分批接入页面。'+(current.failed?'有 '+current.failed+' 篇待返修。':'');document.getElementById('updated').textContent='数据更新于 '+new Date(current.updatedAt).toLocaleTimeString('zh-CN')+' · 页面自动刷新';render();}catch{document.getElementById('updated').textContent='暂时无法刷新进度，请稍后重试。';}}
document.querySelectorAll('[data-grade]').forEach(b=>b.addEventListener('click',()=>{grade=Number(b.dataset.grade);document.querySelectorAll('[data-grade]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));refresh();setInterval(refresh,10000);
</script></html>
